<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Portfolio editor</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23111827'/%3E%3Ctext x='16' y='21' font-family='Arial' font-weight='700' font-size='14' text-anchor='middle' fill='white'%3EED%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,650&family=IBM+Plex+Mono:wght@600&family=IBM+Plex+Sans:wght@400;600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@600&family=Space+Grotesk:wght@600&display=swap">
<link rel="stylesheet" href="css/themes.css">
<link rel="stylesheet" href="css/editor.css">
</head>
<body>
<header class="ed-top">
  <div class="ed-brand">
    <span class="ed-mark" aria-hidden="true">ED</span>
    <div>
      <h1>Portfolio editor</h1>
      <p id="ed-status" role="status">Loading…</p>
    </div>
  </div>
  <div class="ed-top-actions">
    <a class="ed-btn" href="index.html" target="_blank" rel="noopener">View live page</a>
    <button type="button" class="ed-btn" id="toggle-preview">Preview</button>
  </div>
</header>

<div class="ed-layout">
  <nav class="ed-tabs" role="tablist" aria-label="Sections"></nav>
  <main class="ed-form" id="ed-form" aria-live="polite"></main>
  <section class="ed-preview" data-device="desktop" aria-label="Live preview">
    <div class="ed-preview-bar">
      <span>Live preview</span>
      <div class="ed-segment" role="group" aria-label="Preview width">
        <button type="button" data-device="desktop" aria-pressed="true">Desktop</button>
        <button type="button" data-device="phone" aria-pressed="false">Phone</button>
      </div>
    </div>
    <div class="ed-frame-wrap"><iframe id="preview-frame" title="Portfolio preview"></iframe></div>
  </section>
</div>

<script src="js/data.js"></script>
<script src="js/themes.js"></script>
<script src="js/icons.js"></script>
<script src="js/render.js"></script>
<script src="js/media-store.js"></script>
<script src="js/publish.js"></script>
<script src="js/cv-import.js"></script>
<script src="js/editor.js"></script>
</body>
</html>
